<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PhysMaster DSE — HKDSE Physics Study App</title>
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
<div class="app">
  <button class="nav-overlay" id="navOverlay" aria-label="Close menu"></button>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">⚛️</div>
      <div>
        <div class="brand-name">PhysMaster</div>
        <div class="brand-sub">HKDSE Physics</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item active" data-route="dashboard"><span class="ni">🏠</span> Dashboard</a>
      <a class="nav-item" data-route="checker"><span class="ni">✅</span> Answer Checker</a>
      <a class="nav-item" data-route="qa"><span class="ni">💬</span> Physics Q&amp;A</a>
      <a class="nav-item" data-route="notes"><span class="ni">📚</span> Study Notes</a>
      <a class="nav-item" data-route="flashcards"><span class="ni">🃏</span> Flashcards</a>
      <a class="nav-item" data-route="papers"><span class="ni">📝</span> Past Papers</a>
      <a class="nav-item" data-route="practice"><span class="ni">✍️</span> Practice</a>
      <a class="nav-item" data-route="analytics"><span class="ni">📊</span> Analytics</a>
      <a class="nav-item" data-route="tips"><span class="ni">🎯</span> Exam Tips</a>
    </nav>
    <div class="sidebar-foot">
      <button class="btn btn-ghost btn-block" id="resetDataBtn">↺ Reset all progress</button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <span class="topbar-title">⚛️ PhysMaster DSE</span>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>
<script src="lib/echarts-lite.js?v=9"></script>
<script src="js/data.js?v=9"></script>
<script src="js/engine.js?v=9"></script>

</html>
